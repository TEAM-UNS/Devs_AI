[project]
name = "devs-ai"
version = "0.1.0"
description = "채용 데이터 수집 · 임베딩 · LLM 어시스턴트"
requires-python = ">=3.13"
dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- db (postgres + pgvector) ---
    "sqlmodel>=0.0.24",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    # --- auth ---
    "pyjwt[crypto]>=2.9",
    # --- llm / graph ---
    "anthropic>=0.40",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    # --- worker ---
    "arq>=0.26",
    # --- crawler ---
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "ollama>=0.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

# scripts/embed_local/ 전용. torch 를 끌고 와 수 GB 라 기본에서 뺐다.
#     uv sync --group local
#     uv run python -m scripts.embed_local.run
# ★ 호스트 전용이다. 워커 이미지에는 넣지 않는다 — 맥의 Docker 는 GPU(MPS)를
#   통과시키지 않아 컨테이너 안에서는 CPU 로 떨어진다.
#   실측: 호스트 MPS fp16 90.7 청크/초 vs 컨테이너 CPU 3.4 청크/초
local = [
    "sentence-transformers>=3.0",
    # torch 는 sentence-transformers 가 어차피 끌고 오지만, 여기 직접 적어야
    # 아래 [tool.uv.sources] 의 CPU 전용 인덱스 지정이 먹는다.
    # uv 의 source 재정의는 직접 의존성에만 적용되고 전이 의존성은 건너뛴다.
    "torch>=2.0",
]

# ── torch 를 linux 에서는 CPU 전용으로 받는다 ────────────────────────────────
# 기본 PyPI 의 linux 용 torch 는 CUDA 런타임을 끌고 와 이미지가 3.5GB 커진다
# (nvidia/ 2.9GB · triton/ 652MB — 워커는 GPU 를 못 쓰므로 전부 죽은 무게).
# macOS 는 marker 로 제외한다. 기본 PyPI 의 torch 가 MPS 를 지원한다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# 진짜 오류만 본다. import 정렬(I) · 줄바꿈 · 코드 스타일 계열은 켜지 않는다.
#   E9  구문 오류 · 파일 입출력 오류
#   F   미정의 이름(F821) · 미사용 import(F401) 같은 실제 버그
# 명시하지 않으면 기본값 E4,E7,E9,F 가 켜져 스타일 지적이 섞인다.
select = ["E9", "F"]
ignore = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
