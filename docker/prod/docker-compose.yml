name: devs-ai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  ai-api:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    image: ghcr.io/team-uns/devs-ai:${IMAGE_TAG:-latest}
    container_name: devs-ai-api
    restart: unless-stopped
    logging: *logging
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "devs-ai-api"}]'

    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    depends_on:
      ai-redis:
        condition: service_healthy
      ai-ollama:
        condition: service_healthy
    networks:
      - default
      - backend

  ai-worker:
    image: ghcr.io/team-uns/devs-ai:${IMAGE_TAG:-latest}
    container_name: devs-ai-worker
    restart: unless-stopped
    logging: *logging
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "devs-ai-worker"}]'
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    volumes:
      - ../../data/raw:/app/data/raw
    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    depends_on:
      ai-redis:
        condition: service_healthy
      ai-ollama:
        condition: service_healthy
    networks:
      - default
      - backend

  ai-redis:
    image: redis:7-alpine
    container_name: devs-ai-redis
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-ollama:
    image: ollama/ollama:latest
    container_name: devs-ai-ollama
    restart: unless-stopped
    logging: *logging
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  backend:
    external: true
    name: devs-be_backend

volumes:
  redisdata:
  ollama:
