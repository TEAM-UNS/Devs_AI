name: devs-ai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  ai-api:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    image: ghcr.io/team-uns/devs-ai:${IMAGE_TAG:-latest}
    container_name: devs-ai-api
    restart: unless-stopped
    logging: *logging
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "devs-ai-api"}]'

    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    depends_on:
      ai-redis:
        condition: service_healthy
      ai-ollama:
        condition: service_healthy
    networks:
      - default
      - backend

  ai-worker:
    image: ghcr.io/team-uns/devs-ai:${IMAGE_TAG:-latest}
    container_name: devs-ai-worker
    restart: unless-stopped
    logging: *logging
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "devs-ai-worker"}]'
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    volumes:
      - ../../data/raw:/app/data/raw
    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    depends_on:
      ai-redis:
        condition: service_healthy
      ai-ollama:
        condition: service_healthy
    networks:
      - default
      - backend

  ai-redis:
    image: redis:7-alpine
    container_name: devs-ai-redis
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-ollama:
    image: ollama/ollama:latest
    container_name: devs-ai-ollama
    restart: unless-stopped
    logging: *logging
    volumes:
      - ollama:/root/.ollama
    # ★ GPU 를 붙이지 않으면 CPU 로 떨어진다. 컨테이너는 기본적으로 호스트
    #   GPU 에 접근하지 못해서, 카드가 꽂혀 있어도 설정이 없으면 못 쓴다.
    #   실측: CPU 로 공고 23건 임베딩에 185초. 그 탓에 crawl_site 가 arq
    #   작업 제한(600초)을 넘겨 죽고, 공고는 들어왔는데 청크가 없는 상태가
    #   686건 생겼다.
    #   호스트에 NVIDIA Container Toolkit 이 설치돼 있어야 한다:
    #     sudo docker run --rm --gpus all ubuntu nvidia-smi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  backend:
    external: true
    name: devs-be_backend

volumes:
  redisdata:
  ollama:
