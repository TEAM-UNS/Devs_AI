# 기술 스택 사전. extractor.py 가 로드한다.
#
# <canonical name>:
#   field:    core/enums.py 의 TechField
#   aliases:  본문에서 매칭할 표기 변형 (소문자 비교)
#   requires: 함께 등장하면 오탐이 줄어드는 보조 토큰 (선택)

version: 1

skills:
  Spring Boot:
    field: FRAMEWORK
    aliases: ["spring boot", "springboot", "스프링부트", "스프링 부트"]

  Kotlin:
    field: LANGUAGE
    aliases: ["kotlin", "코틀린"]

  React:
    field: FRAMEWORK
    aliases: ["react", "react.js", "reactjs", "리액트"]

  Go:
    field: LANGUAGE
    aliases: ["golang", "go 언어"]
    requires: ["개발", "backend", "서버"] # 단독 "go" 오탐 방지

# 무시할 토큰 (회사명·복리후생 등에서 나오는 오탐)
stopwords:
  - "c"
  - "r"
  - "go"
