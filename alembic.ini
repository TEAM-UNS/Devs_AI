# Alembic config.
#
#   alembic revision --autogenerate -m "..."
#   alembic upgrade head
#
# Do NOT put the connection URL here. env.py reads DATABASE_URL from app.core.config.
#
# ASCII only: alembic reads this file with the *locale* encoding (cp949 on a
# Korean Windows), so non-ASCII comments break config parsing. Korean notes go
# in alembic/env.py and alembic/versions/README.md instead.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]
# ruff ships as a standalone binary, not a console_scripts entry point,
# so this must be `exec` rather than `console_scripts`.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
